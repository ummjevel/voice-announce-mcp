[project]
name = "voice-announce-mcp"
version = "0.1.0"
description = "MCP server that speaks short task summaries out loud (FreyaTTS-based) for Claude Code / Codex, on Mac, Windows, and WSL2."
# Upper bound matches FreyaTTS's -- see that repo's pyproject.toml for why:
# a too-new Python otherwise fails deep inside pip/uv's internals instead of
# with a clear "unsupported" message.
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp>=1.0.0",
    "torch",
    "numpy",
    "soundfile",
    "huggingface_hub",
    "safetensors",
    "einops",
    "pydantic",
    "uroman",
    # freyatts isn't on PyPI -- pip fetches it straight from the (now
    # pip-installable) FreyaTTS repo. No manual clone/PYTHONPATH needed.
    # (No `voxcpm` here either -- freyatts vendors the one module it needs
    # from it, see FreyaTTS/freyatts/_vendor/audiovae/.)
    "freyatts @ git+https://github.com/ummjevel/FreyaTTS.git",
]

[project.scripts]
voice-announce-mcp = "voice_announce_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
